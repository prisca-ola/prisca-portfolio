  <style>
    /* ============ Contact (rebuilt from the former Framer contact page) ============ */
    :root { --pg:#161616; --card:#0c0c0c; --ink:#f3f1ec; --ink-2:#a29e97; --line:rgba(255,255,255,0.12); }
    html, body { height:auto; overflow:visible; }
    .ct-body { background:var(--pg); color:var(--ink); overflow-x:hidden; font-family:"Satoshi",system-ui,sans-serif; }
    /* Film-grain noise over the canvas */
    .ct-body::before { display:block; opacity:0.16; }
    .disp { font-family:"Clash Display","Satoshi",sans-serif; }

    .ct-body .topbar { background:var(--pg); border-bottom:1px solid var(--line); z-index:100; }
    .ct-body .brand, .ct-body .menu-btn { color:var(--ink); }
    .ct-body .menu-overlay { background:var(--pg); }
    .ct-body .menu-nav a { color:var(--ink); }

    .ct-main { position:relative; z-index:1; padding:calc(var(--topbar-h) + clamp(28px,5vh,56px)) var(--margin) clamp(40px,7vh,80px); }
    .ct-col { max-width: 520px; margin: 0 auto; }     /* centred column */

    .ct-title { font-weight:600; font-size:clamp(52px,8vw,104px); letter-spacing:-0.02em; line-height:0.95; color:var(--ink); margin:0 0 clamp(28px,4vh,44px); }

    /* Contact cards */
    .ct-cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ct-card {
      background:var(--card); border:none; border-radius:12px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
      text-align:center; padding:20px 16px; min-height:84px;
      transition:background 0.25s var(--ease), transform 0.25s var(--ease);
    }
    a.ct-card:hover { background:#1a1a1a; transform:translateY(-2px); }
    .ct-card.wide { grid-column:1 / -1; }
    .ct-socials3 { grid-column:1 / -1; display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
    .ct-k { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-2); }
    .ct-v { font-size:clamp(15px,1.6vw,18px); font-weight:500; color:var(--ink); word-break:break-word; }
    .ct-ico { width:26px; height:26px; display:grid; place-items:center; color:var(--ink); }
    .ct-ico svg { width:22px; height:22px; fill:currentColor; }
    .ct-ico .be { font-family:"Clash Display",serif; font-weight:600; font-size:19px; line-height:1; }

    /* Message form */
    .ct-formhead { margin:clamp(28px,4vh,40px) 0 16px; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-2); text-align:center; }
    .ct-form { display:flex; flex-direction:column; gap:12px; }
    .ct-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .ct-form input, .ct-form textarea {
      width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px;
      color:var(--ink); font-family:inherit; font-size:15px; padding:14px 16px;
      transition:border-color 0.25s var(--ease), background 0.25s var(--ease);
    }
    .ct-form textarea { min-height:130px; resize:vertical; }
    .ct-form input::placeholder, .ct-form textarea::placeholder { color:var(--ink-2); }
    .ct-form input:focus, .ct-form textarea:focus { outline:none; border-color:var(--primary); background:#2a2a2a; }
    .ct-submit {
      height:54px; border:none; border-radius:10px; background:var(--primary); color:#fff;
      font-family:inherit; font-size:15px; font-weight:600; letter-spacing:0.04em; cursor:pointer;
      transition:filter 0.25s var(--ease), transform 0.25s var(--ease);
    }
    .ct-submit:hover { filter:brightness(1.07); transform:translateY(-1px); }
    .ct-note { font-size:14px; color:var(--ink-2); text-align:center; padding-top:6px; min-height:20px; }
    .ct-note.ok { color:#4bd18a; }

    /* Name marquee footer */
    .ct-marquee { overflow:hidden; border-top:1px solid var(--line); margin-top:clamp(48px,8vh,96px); padding:clamp(16px,3vw,30px) 0; }
    .ct-marquee-track { display:inline-flex; align-items:center; white-space:nowrap; animation:ctMarq 24s linear infinite; }
    .ct-marquee-track span { font-weight:600; font-size:clamp(34px,6vw,80px); letter-spacing:-0.01em; color:var(--ink); padding:0 0.35em; }
    .ct-marquee-track i { color:var(--ink-2); font-style:normal; font-size:clamp(13px,1.6vw,22px); }
    @keyframes ctMarq { to { transform:translateX(-50%); } }
    @media (prefers-reduced-motion:reduce) { .ct-marquee-track { animation:none; } }

    @media (max-width:520px) { .ct-row { grid-template-columns:1fr; } }

  <script>
    /* Menu */
    (function () {
      var btn = document.getElementById("menuBtn"), overlay = document.getElementById("menuOverlay");
      if (!btn || !overlay) return;
      function setOpen(o) {
        overlay.classList.toggle("open", o); btn.classList.toggle("active", o);
        btn.setAttribute("aria-expanded", o ? "true" : "false");
        btn.setAttribute("aria-label", o ? "Close menu" : "Open menu");
        overlay.setAttribute("aria-hidden", o ? "false" : "true");
      }
      btn.addEventListener("click", function () { setOpen(!overlay.classList.contains("open")); });
      overlay.addEventListener("click", function (e) { if (e.target.closest("a")) setOpen(false); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
    })();

    /* Contact form -> Netlify Forms (AJAX submit so we keep the inline confirmation). */
    (function () {
      var form = document.getElementById("ctForm"), note = document.getElementById("ctNote");
      if (!form) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var d = new FormData(form);
        if (!d.get("name") || !d.get("email") || !d.get("message")) {
          note.className = "ct-note"; note.textContent = "Please fill in your name, email and message.";
          return;
        }
        var btn = form.querySelector(".ct-submit");
        if (btn) { btn.disabled = true; btn.textContent = "Sending…"; }
        note.className = "ct-note"; note.textContent = "Sending…";
        var body = new URLSearchParams();
        d.forEach(function (v, k) { body.append(k, v); });
        // Netlify captures the submission when we POST the encoded form (incl. form-name) to the site root.
        fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() })
          .then(function (r) {
            if (!r.ok) throw new Error("bad status");
            note.className = "ct-note ok";
            note.textContent = "Thanks! Your message has been sent.";
            form.reset();
          })
          .catch(function () {
            note.className = "ct-note";
            note.textContent = "Something went wrong. Please email olatunjiprisca@gmail.com directly.";
          })
          .finally(function () {
            if (btn) { btn.disabled = false; btn.textContent = "Submit"; }
          });
      });
    })();

    /* Custom trailing cursor (mouse only) */
    (function () {
      var dot = document.createElement("div"); dot.className = "cursor-dot"; document.body.appendChild(dot);
      var x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, shown = false, rafId = null;
      function show() { if (!shown) { shown = true; dot.classList.add("show"); } if (rafId === null) rafId = requestAnimationFrame(raf); }
      function onMove(cx, cy) { tx = cx; ty = cy; show(); }
      if ("PointerEvent" in window) { addEventListener("pointermove", function (e) { if (e.pointerType && e.pointerType !== "mouse") return; onMove(e.clientX, e.clientY); }, { passive: true }); }
      else { addEventListener("mousemove", function (e) { onMove(e.clientX, e.clientY); }, { passive: true }); }
      document.addEventListener("mouseleave", function () { shown = false; dot.classList.remove("show"); });
      document.addEventListener("mouseenter", function () { if (shown) dot.classList.add("show"); });
      var HOT = "a, button, input, textarea, .menu-btn";
      document.addEventListener("mouseover", function (e) { if (e.target.closest && e.target.closest(HOT)) dot.classList.add("hot"); });
      document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest(HOT)) dot.classList.remove("hot"); });
      function raf() { x += (tx - x) * 0.18; y += (ty - y) * 0.18; dot.style.transform = "translate(" + x + "px," + y + "px) translate(-50%, -50%)"; rafId = requestAnimationFrame(raf); }
    })();
  </script>
