<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Gallery &middot; Prisca Olatunji</title>
  <meta name="description" content="Design gallery, selected visual work by Prisca Olatunji." />

  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* Sub-page: normal scroll (the shared sheet locks scroll for the snap home page) */
    html, body { height: auto; overflow: visible; }
    body { overflow-x: hidden; }
    .subpage-main { position: relative; z-index: 1; padding: calc(var(--topbar-h) + var(--s8)) var(--margin) var(--s10); }
    .subpage-head { max-width: none; margin: 0 0 var(--s8); }
    .subpage-head h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(44px, 8vw, 96px); font-weight: 600; letter-spacing: -0.015em; line-height: 0.98;
    }
    .subpage-head p { margin-top: var(--s3); max-width: 52ch; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.7; color: var(--muted); }

    .gal { max-width: none; margin: 0; }
    .gal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px, 2vw, 28px); }
    .gal-item {
      position: relative; border-radius: 16px; overflow: hidden;
      display: grid; place-items: center;
      background: linear-gradient(160deg, var(--surface), var(--primary));
      border: 1px solid var(--border);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.24);
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .gal-item:hover { transform: translateY(-4px); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.34); }
    .gal-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gal-item .m { font-family: "Fraunces", Georgia, serif; font-size: clamp(28px, 4vw, 48px); font-weight: 600; color: rgba(255,255,255,0.34); }
    /* varied heights for a gallery rhythm */
    .gal-item.t { aspect-ratio: 3 / 4; }
    .gal-item.s { aspect-ratio: 4 / 3; }
    .gal-item.w { aspect-ratio: 1 / 1; }
    @media (max-width: 820px) { .gal-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .gal-grid { grid-template-columns: 1fr; } }

    .subpage-foot { max-width: none; margin: var(--s10) 0 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">priscy</a>
    <div class="topbar-actions">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" />
        </svg>
        <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z" />
        </svg>
      </button>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay" aria-hidden="true">
    <nav class="menu-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="about.html">About me</a>
      <a href="resume.pdf" target="_blank" rel="noopener">Resume</a>
      <a href="index.html#contact">Contact</a>
      <a href="gallery.html">Design Gallery</a>
    </nav>
  </div>

  <main class="subpage-main">
    <div class="subpage-head">
      <h1>Design Gallery</h1>
      <p>A living collection of selected visuals, explorations, and finished pieces. Drop your images into <code>works/gallery/</code> and I'll wire them into these tiles.</p>
    </div>

    <div class="gal">
      <div class="gal-grid">
        <a class="gal-item t" href="#"><span class="m">01</span></a>
        <a class="gal-item s" href="#"><span class="m">02</span></a>
        <a class="gal-item t" href="#"><span class="m">03</span></a>
        <a class="gal-item w" href="#"><span class="m">04</span></a>
        <a class="gal-item t" href="#"><span class="m">05</span></a>
        <a class="gal-item s" href="#"><span class="m">06</span></a>
        <a class="gal-item s" href="#"><span class="m">07</span></a>
        <a class="gal-item t" href="#"><span class="m">08</span></a>
        <a class="gal-item w" href="#"><span class="m">09</span></a>
        <a class="gal-item t" href="#"><span class="m">10</span></a>
        <a class="gal-item s" href="#"><span class="m">11</span></a>

    <div class="subpage-foot">
      <a class="btn" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
        Back home
      </a>
    </div>
  </main>

  <script>
    (function () {
      var html = document.documentElement, KEY = "prisca.theme";
      function apply(t) { html.setAttribute("data-theme", t); try { localStorage.setItem(KEY, t); } catch (e) {} }
      var saved; try { saved = localStorage.getItem(KEY); } catch (e) {}
      if (saved === "light" || saved === "dark") apply(saved);
      else apply(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var t = document.getElementById("themeToggle");
      if (t) t.addEventListener("click", function () { apply(html.getAttribute("data-theme") === "dark" ? "light" : "dark"); });
    })();
    (function () {
      var dot = document.createElement("div"); dot.className = "cursor-dot"; document.body.appendChild(dot);
      var x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y, shown = false, rafId = null;
      function show() { if (!shown) { shown = true; dot.classList.add("show"); } if (rafId === null) rafId = requestAnimationFrame(raf); }
      function onMove(cx, cy) { tx = cx; ty = cy; show(); }
      if ("PointerEvent" in window) { addEventListener("pointermove", function (e) { if (e.pointerType && e.pointerType !== "mouse") return; onMove(e.clientX, e.clientY); }, { passive: true }); }
      else { addEventListener("mousemove", function (e) { onMove(e.clientX, e.clientY); }, { passive: true }); }
      document.addEventListener("mouseleave", function () { shown = false; dot.classList.remove("show"); });
      document.addEventListener("mouseenter", function () { if (shown) dot.classList.add("show"); });
      var HOT = "a, button, .theme-toggle, .gal-item";
      document.addEventListener("mouseover", function (e) { if (e.target.closest && e.target.closest(HOT)) dot.classList.add("hot"); });
      document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest(HOT)) dot.classList.remove("hot"); });
      function raf() { x += (tx - x) * 0.18; y += (ty - y) * 0.18; dot.style.transform = "translate(" + x + "px," + y + "px) translate(-50%, -50%)"; rafId = requestAnimationFrame(raf); }
    })();
  </script>

  <script>
    (function () {
      var btn = document.getElementById("menuBtn"), overlay = document.getElementById("menuOverlay");
      if (!btn || !overlay) return;
      function setOpen(o) {
        overlay.classList.toggle("open", o); btn.classList.toggle("active", o);
        btn.setAttribute("aria-expanded", o ? "true" : "false");
        btn.setAttribute("aria-label", o ? "Close menu" : "Open menu");
        overlay.setAttribute("aria-hidden", o ? "false" : "true");
      }
      btn.addEventListener("click", function () { setOpen(!overlay.classList.contains("open")); });
      overlay.addEventListener("click", function (e) { if (e.target.closest("a")) setOpen(false); });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
    })();
  </script>
</body>
</html>
